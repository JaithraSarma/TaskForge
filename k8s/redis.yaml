# =============================================================================
# TaskForge — Redis 7 (Celery broker + result backend)
# Stateless Deployment (single replica; Redis is not clustered here) plus the
# ClusterIP Service ("taskforge-redis") that CELERY_BROKER_URL /
# CELERY_RESULT_BACKEND / REDIS_HOST resolve against.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: taskforge-redis
  namespace: taskforge
  labels:
    app.kubernetes.io/name: taskforge
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: taskforge
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskforge-redis
  namespace: taskforge
  labels:
    app.kubernetes.io/name: taskforge
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taskforge
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskforge
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 320Mi
