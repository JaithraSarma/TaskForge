# =============================================================================
# TaskForge — Celery Worker
# Deployment (2 replicas), same image as the API but running the celery
# command instead. No Service/ports — the worker has no HTTP surface; health
# is checked via `celery inspect ping` over the broker connection instead.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskforge-worker
  namespace: taskforge
  labels:
    app.kubernetes.io/name: taskforge
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: taskforge
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskforge
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: taskforge:latest
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args:
            - "-A"
            - "worker.celery_app:celery_app"
            - "worker"
            - "--loglevel=info"
            - "--concurrency=4"
            - "--queues=high,default,low"
          envFrom:
            - configMapRef:
                name: taskforge-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskforge-db-secret
                  key: POSTGRES_PASSWORD
          # No HTTP port to probe; use celery's own ping over the broker
          # connection to confirm the worker process is alive and responsive.
          livenessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "celery -A worker.celery_app:celery_app inspect ping -d celery@$(hostname) --timeout 10"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
