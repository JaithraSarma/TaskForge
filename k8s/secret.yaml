# =============================================================================
# TaskForge — Secret holding the Postgres password.
#
# DEMO VALUE ONLY. "taskforge_secret" is committed here in plaintext purely to
# mirror the docker-compose topology for local/demo clusters. In a real
# environment, do NOT commit secrets to git — generate this from a sealed-secret
# (bitnami-labs/sealed-secrets) or an External Secrets Operator source (Vault,
# AWS Secrets Manager, etc.) as part of the deploy pipeline instead.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: taskforge-db-secret
  namespace: taskforge
  labels:
    app.kubernetes.io/name: taskforge
type: Opaque
stringData:
  POSTGRES_PASSWORD: "taskforge_secret"
