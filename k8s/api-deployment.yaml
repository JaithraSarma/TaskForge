# =============================================================================
# TaskForge — API (FastAPI/uvicorn)
# Deployment (2 replicas) + ClusterIP Service exposing port 8000.
# Liveness hits the cheap /health endpoint; readiness hits /health/ready,
# which checks DB+Redis connectivity and returns 503 when not ready.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: taskforge-api
  namespace: taskforge
  labels:
    app.kubernetes.io/name: taskforge
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: taskforge
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskforge-api
  namespace: taskforge
  labels:
    app.kubernetes.io/name: taskforge
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: taskforge
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskforge
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: taskforge:latest
          # Image is built/loaded into the cluster locally (see k8s/README.md);
          # IfNotPresent avoids an unnecessary registry pull for that tag.
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: taskforge-config
          env:
            # Pulled from the Secret directly (rather than baked into the
            # ConfigMap's DATABASE_URL) to demonstrate the intended pattern
            # for a real deployment; see secret.yaml for caveats.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskforge-db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: prometheus-multiproc
              mountPath: /prometheus_multiproc
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        # Scratch space for Prometheus multi-process metrics collection;
        # doesn't need to persist across pod restarts.
        - name: prometheus-multiproc
          emptyDir: {}
